<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smashing Pumpkins Factory — Dev</title>
<style>body{font-family:system-ui;background:#17131b;color:#fff;margin:0;padding:2rem;text-align:center}main{max-width:720px;margin:auto}button{font-size:1.2rem;padding:1rem;border-radius:12px;cursor:pointer}#wall{background:repeating-linear-gradient(0deg,#773f31 0 34px,#37231f 35px 39px);padding:3rem 1rem;border:5px solid #3a2928;border-radius:16px}#pumpkin{font-size:6rem;display:block;margin:1rem}#status{min-height:2em}</style></head>
<body><main><h1>🎃 Smashing Pumpkins Factory</h1><p>Standalone development prototype. Original Smash House is untouched. No participation tickets are issued.</p><section id="wall" aria-label="Brick wall target"><span id="pumpkin" aria-hidden="true">🎃</span></section><p><button id="throw">Throw Pumpkin</button></p><p id="status" role="status">Ready to smash.</p><p>Practice smashes: <strong id="count">0</strong></p></main>
<script>let count=0;const pumpkin=document.getElementById('pumpkin'),status=document.getElementById('status');document.getElementById('throw').addEventListener('click',()=>{count++;pumpkin.textContent='💥';status.textContent='SPLAT! Practice only — no rewards.';document.getElementById('count').textContent=count;setTimeout(()=>{pumpkin.textContent='🎃'},500)});</script></body></html>
